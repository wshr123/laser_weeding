camera_matrix:
  fx: 609.101684570312      # 焦距x (像素)
  fy: 607.88696289062      # 焦距y (像素)
  cx: 316.927886962890      # 主点x (像素)
  cy: 236.43728637695312      # 主点y (像素)

distortion_coeffs: []  # 畸变系数 [k1, k2, p1, p2, k3]

extrinsics:
  # 相机在振镜坐标系中的位置 (mm)
  t_gc: [0.0, 100.0, 0.0]  # [右+左-, 前+后-, 上+下-]
  # 相机在振镜坐标系中的姿态四元数 [x, y, z, w]
  q_gc: [0.0, 0.0, 0.0, 1.0]  # 无旋转

work_plane:
  # 工作平面法向量 (单位向量)
  n_g: [0.0, 0.0, 1.0]  # Z轴向上
  # 平面到振镜原点的距离 (mm, 负值表示在下方)
  d_g: -2560

galvo_params:
  scan_angle: 46.0   # 总扫描角度 (度)
  scan_angle_x_plus: 45.4   # X轴正向最大角度 (度)
  scan_angle_x_minus: 45.8  # X轴负向最大角度 (度)
  scan_angle_y_plus: 47.4   # Y轴正向最大角度 (度)
  scan_angle_y_minus: 45.8  # Y轴负向最大角度 (度)
  scale_x: 1.0       # X轴比例因子
  scale_y: 1.0       # Y轴比例因子
  bias_x: 0.0        # X轴零点偏移 (度)
  bias_y: 0.0        # Y轴零点偏移 (度)
  max_code: 32767    # 最大码值

galvos:
  - name: left_head
    extrinsics:
      t_gc_mm: [-120.0, 100.0, 0.0]
      q_gc_xyzw: [0.0, 0.0, 0.0, 1.0]
    code_offset: [0.0, 0.0]
    code_scale: [1.0, 1.0]
    max_code: 31500
    code_limits:
      x: [-30500, 32000]
      y: [-30000, 31000]
    galvo_params:
      scan_angle: 46.0
      scan_angle_x_plus: 45.4
      scan_angle_x_minus: 45.8
      scan_angle_y_plus: 47.4
      scan_angle_y_minus: 45.8
      scale_x: 1.0
      scale_y: 1.0
      bias_x: 0.0
      bias_y: 0.0
      max_code: 31500

  - name: right_head
    extrinsics:
      t_gc_mm: [120.0, 100.0, 0.0]
      q_gc_xyzw: [0.0, 0.0, 0.0, 1.0]
    code_offset: [0.0, 0.0]
    code_scale: [1.0, 1.0]
    max_code: 32000
    code_limits:
      x: [-32000, 30500]
      y: [-31000, 30000]
    galvo_params:
      scan_angle: 45.0
      scan_angle_x_plus: 44.6
      scan_angle_x_minus: 45.2
      scan_angle_y_plus: 46.1
      scan_angle_y_minus: 44.8
      scale_x: 1.0
      scale_y: 1.0
      bias_x: 0.0
      bias_y: 0.0
      max_code: 32000

manual_calibration:
  enabled: true                      # 启用手工标定结果自动加载
  result_file: manual_galvo_calibration.yaml  # 标定输出文件（相对仓库根目录或绝对路径）
  apply_extrinsics: true             # 使用手工标定的外参覆盖配置中的值
  apply_bias: true                   # 使用手工标定的偏置/比例更新 galvo_params
  apply_code_limits: true            # 如有需要，更新码值范围
  match_by_name: true                # 通过 name 优先匹配振镜
  fallback_to_id: true               # 如 name 未匹配，则按 id 匹配
