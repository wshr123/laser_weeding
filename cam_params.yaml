distortion_coeffs: []  # 畸变系数 [k1, k2, p1, p2, k3]

extrinsics:
  # 相机在振镜坐标系中的位置 (mm)
  t_gc: [0.0, -60.0, -45.0]  # [x,y,z]
  # 相机在振镜坐标系中的姿态四元数 [x, y, z, w]
  q_gc: [0.0, 1.0, 0.0, 0.0]  # 绕y转180


fix_extrinsics:
  # 相机在振镜坐标系中的位置 (mm)
  t_fix: [0.3701973292080396,23.310005070223355, 0.0036270438566816665]  # [x,y,z]
  # 相fix机在振镜坐标系中的姿态四元数 [x, y, z, w]
  q_fix: [-0.0004699741261038471, -0.00014003657002631425, -0.012279690951012832, 0.9999244815005919]

