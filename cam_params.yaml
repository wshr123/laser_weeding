work_plane:
  # 工作平面法向量 (单位向量)
  n_g: [0.0, 0.0, 1.0]  # Z轴向上
  # 平面到振镜原点的距离 (mm, 负值表示在下方)
  d_g: -1000

galvo_params:
  scan_angle: 46.0   # 总扫描角度 (度)
  scan_angle_x_plus: 45.4
  scan_angle_x_minus: 45.8
  scan_angle_y_plus: 47.4
  scan_angle_y_minus: 45.8
  scale_x: 1.0       # X轴比例因子
  scale_y: 1.0       # Y轴比例因子
  bias_x: 0.0        # X轴零点偏移 (度)
  bias_y: 0.0        # Y轴零点偏移 (度)
  max_code: 32767    # 最大码值
